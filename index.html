<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Catálogo de Cartas</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="topbar">
  <div class="topbar-row">
    <div class="brand" id="brandTap">
      <span class="name">🎴 Mi Catálogo</span>
      <span class="sub" id="subLabel">WWE &amp; MLB · Tarjetas coleccionables</span>
    </div>
    <button class="icon-btn" id="adminBtn" title="Modo administrador" style="display:none;">🔒</button>
  </div>
  <div class="search-wrap">
    <span class="ic">🔎</span>
    <input type="text" id="searchInput" placeholder="Buscar jugador, set, año...">
  </div>
  <div class="chip-row" id="sportChips"></div>
  <div class="chip-row" id="catChips"></div>
</div>

<div class="grid" id="grid"></div>

<button class="fab" id="fabAdd" style="display:none;">+</button>
<div class="toast" id="toast"></div>

<script src="app.js"></script>
</body>
</html>
